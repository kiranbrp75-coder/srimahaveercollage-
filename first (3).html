<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f8f3">
  <title>Pictures About School | SMC Moodbidri, D.K.</title>
  <style>
    :root {
      --green-900: #123d2f;
      --green-700: #176b50;
      --green-100: #ebf4ee;
      --muted: #52615d;
      --white: #ffffff;
      --shadow: 0 18px 38px rgba(17, 34, 28, 0.12);
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f7f8f4 0%, #eef5f2 100%);
      color: var(--green-900);
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar {
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 1px solid rgba(22, 90, 71, 0.12);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(8px);
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 74px;
    }

    .brand {
      font-size: clamp(1rem, 1.4vw, 1.2rem);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green-700);
      text-decoration: none;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
    }

    .nav a {
      padding: 9px 12px;
      border-radius: 999px;
      color: var(--green-900);
      font-size: 0.92rem;
      font-weight: 700;
      text-decoration: none;
    }

    .nav a:hover,
    .nav a:focus-visible {
      background: var(--green-100);
      color: var(--green-700);
      outline: none;
    }

    .page {
      padding: 48px 0 58px;
    }

    .page-heading {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.04em;
    }

    .intro {
      color: var(--muted);
      margin: 0;
      line-height: 1.8;
      font-size: 1.02rem;
      max-width: 700px;
    }

    .gallery-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .filter-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .filter-button {
      border: 1px solid rgba(23, 102, 81, 0.16);
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--white);
      color: var(--green-900);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .filter-button:hover,
    .filter-button:focus-visible,
    .filter-button[aria-pressed="true"] {
      background: var(--green-700);
      border-color: var(--green-700);
      color: var(--white);
      outline: none;
    }

    .gallery-count {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 24px;
    }

    .gallery-item {
      margin: 0;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(17, 51, 43, 0.08);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 12px 26px rgba(18, 35, 29, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gallery-item:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 30px rgba(18, 35, 29, 0.12);
    }

    .gallery-item[hidden] {
      display: none;
    }

    .gallery-open {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: #e8eee9;
      cursor: zoom-in;
      overflow: hidden;
    }

    .gallery-open:focus-visible {
      outline: 3px solid #d9b26d;
      outline-offset: -3px;
    }

    .gallery-item img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .gallery-item:hover img,
    .gallery-open:focus-visible img {
      transform: scale(1.06);
    }

    .gallery-item figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px 16px;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.5;
    }

    .gallery-category {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--green-100);
      color: var(--green-700);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .back-link {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 18px;
      background: var(--green-700);
      color: var(--white);
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
    }

    .lightbox {
      width: min(1100px, calc(100% - 32px));
      max-width: none;
      max-height: calc(100% - 32px);
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      background: #10241f;
      color: var(--white);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .lightbox::backdrop {
      background: rgba(5, 18, 15, 0.86);
      backdrop-filter: blur(5px);
    }

    .lightbox-content {
      position: relative;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      height: min(82vh, 760px);
    }

    .lightbox-image-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 56px 72px 12px;
    }

    .lightbox-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .lightbox-caption {
      margin: 0;
      padding: 12px 20px 18px;
      color: rgba(255, 255, 255, 0.86);
      text-align: center;
      line-height: 1.5;
    }

    .lightbox-button {
      position: absolute;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: var(--white);
      font: inherit;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .lightbox-button:hover,
    .lightbox-button:focus-visible {
      background: rgba(255, 255, 255, 0.25);
      outline: 2px solid #d9b26d;
      outline-offset: 2px;
    }

    .lightbox-close {
      top: 14px;
      right: 14px;
      font-size: 1.8rem;
    }

    .lightbox-prev,
    .lightbox-next {
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-prev { left: 14px; }
    .lightbox-next { right: 14px; }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 800px) {
      .gallery-grid {
        grid-template-columns: 1fr 1fr;
      }

      .lightbox-image-wrap {
        padding-right: 58px;
        padding-left: 58px;
      }
    }

    @media (max-width: 560px) {
      .topbar-inner {
        flex-direction: column;
        padding: 12px 0 14px;
      }

      .nav {
        justify-content: center;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .lightbox-content {
        height: min(76vh, 620px);
      }

      .lightbox-image-wrap {
        padding: 58px 12px 10px;
      }

      .lightbox-prev {
        left: 8px;
      }

      .lightbox-next {
        right: 8px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="first.html" class="brand">SMC Moodbidri, D.K.</a>
      <nav class="nav" aria-label="Main navigation">
        <a href="about-school.html">About School</a>
        <a href="about-us.html">About Us</a>
        <a href="discover-our-school.html">Discover</a>
        <a href="our-campus.html">Our Campus</a>
        <a href="pictures-about-school.html">Gallery</a>
        <a href="teaching-staff.html">Teaching Staff</a>
      </nav>
    </div>
  </header>

  <main class="page">
    <div class="container">
      <div class="page-heading">
        <h1>Pictures About School</h1>
        <p class="intro">Explore photos from the campus and college community. Select any picture to view it larger.</p>
      </div>

      <div class="gallery-toolbar">
        <div class="filter-list" role="group" aria-label="Filter gallery photos">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All photos</button>
          <button class="filter-button" type="button" data-filter="campus" aria-pressed="false">Campus</button>
          <button class="filter-button" type="button" data-filter="learning" aria-pressed="false">Learning</button>
          <button class="filter-button" type="button" data-filter="community" aria-pressed="false">College community</button>
        </div>
        <p class="gallery-count" aria-live="polite"></p>
      </div>

      <div class="gallery-grid" id="gallery-grid">
        <figure class="gallery-item" data-category="campus">
          <button class="gallery-open" type="button" aria-label="View campus photo">
            <img src="first.png.jpg" alt="School building and campus" width="480">
          </button>
          <figcaption><span>Our campus</span><span class="gallery-category">Campus</span></figcaption>
        </figure>
        <figure class="gallery-item" data-category="learning">
          <button class="gallery-open" type="button" aria-label="View learning photo">
            <img src="second.png.jpeg" alt="Students learning together" width="480">
          </button>
          <figcaption><span>Learning together</span><span class="gallery-category">Learning</span></figcaption>
        </figure>
        <figure class="gallery-item" data-category="campus">
          <button class="gallery-open" type="button" aria-label="View campus atmosphere photo">
            <img src="images.jpg" alt="Campus life image" width="480">
          </button>
          <figcaption><span>Campus atmosphere</span><span class="gallery-category">Campus</span></figcaption>
        </figure>
        <figure class="gallery-item" data-category="learning">
          <button class="gallery-open" type="button" aria-label="View academic environment photo">
            <img src="images (1).jpg" alt="Academic environment" width="480">
          </button>
          <figcaption><span>Academic environment</span><span class="gallery-category">Learning</span></figcaption>
        </figure>
        <figure class="gallery-item" data-category="community">
          <button class="gallery-open" type="button" aria-label="View student activity photo">
            <img src="images (2).jpg" alt="Student activity" width="480">
          </button>
          <figcaption><span>Student activity</span><span class="gallery-category">Community</span></figcaption>
        </figure>
        <figure class="gallery-item" data-category="community">
          <button class="gallery-open" type="button" aria-label="View college community photo">
            <img src="images (3).jpg" alt="College community" width="480">
          </button>
          <figcaption><span>College community</span><span class="gallery-category">Community</span></figcaption>
        </figure>
        <figure class="gallery-item" data-category="learning">
          <button class="gallery-open" type="button" aria-label="View learning space photo">
            <img src="images (4).jpg" alt="Learning spaces" width="480">
          </button>
          <figcaption><span>Learning spaces</span><span class="gallery-category">Learning</span></figcaption>
        </figure>
        <figure class="gallery-item" data-category="community">
          <button class="gallery-open" type="button" aria-label="View college gathering photo">
            <img src="images (5).jpg" alt="College gathering" width="480">
          </button>
          <figcaption><span>College gathering</span><span class="gallery-category">Community</span></figcaption>
        </figure>
        <figure class="gallery-item" data-category="community">
          <button class="gallery-open" type="button" aria-label="View college memories photo">
            <img src="images (6).jpg" alt="College memories" width="480">
          </button>
          <figcaption><span>College memories</span><span class="gallery-category">Community</span></figcaption>
        </figure>
        <figure class="gallery-item" data-category="campus">
          <button class="gallery-open" type="button" aria-label="View college building photo">
            <img src="download.jpg" alt="College building" width="480">
          </button>
          <figcaption><span>College building</span><span class="gallery-category">Campus</span></figcaption>
        </figure>
        <figure class="gallery-item" data-category="campus">
          <button class="gallery-open" type="button" aria-label="View green campus photo">
            <img src="school-background.png" alt="Green campus view" width="480">
          </button>
          <figcaption><span>Green campus view</span><span class="gallery-category">Campus</span></figcaption>
        </figure>
      </div>

      <a href="first.html" class="back-link">Back to Home</a>
    </div>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <div class="lightbox-content">
      <button class="lightbox-button lightbox-close" type="button" aria-label="Close photo viewer">&times;</button>
      <button class="lightbox-button lightbox-prev" type="button" aria-label="Previous photo">&#8249;</button>
      <div class="lightbox-image-wrap">
        <img class="lightbox-image" id="lightbox-image" src="" alt="">
      </div>
      <button class="lightbox-button lightbox-next" type="button" aria-label="Next photo">&#8250;</button>
      <p class="lightbox-caption" id="lightbox-caption"></p>
    </div>
  </dialog>

  <script>
    const gallery = document.querySelector('#gallery-grid');
    const galleryItems = Array.from(gallery.querySelectorAll('.gallery-item'));
    const filterButtons = Array.from(document.querySelectorAll('.filter-button'));
    const galleryCount = document.querySelector('.gallery-count');
    const lightbox = document.querySelector('#lightbox');
    const lightboxImage = document.querySelector('#lightbox-image');
    const lightboxCaption = document.querySelector('#lightbox-caption');
    const closeButton = document.querySelector('.lightbox-close');
    const previousButton = document.querySelector('.lightbox-prev');
    const nextButton = document.querySelector('.lightbox-next');
    let activeItems = galleryItems;
    let activeIndex = 0;

    function updateGalleryCount() {
      const visibleCount = galleryItems.filter((item) => !item.hidden).length;
      galleryCount.textContent = `${visibleCount} ${visibleCount === 1 ? 'photo' : 'photos'}`;
    }

    filterButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const filter = button.dataset.filter;

        filterButtons.forEach((filterButton) => {
          filterButton.setAttribute('aria-pressed', String(filterButton === button));
        });

        galleryItems.forEach((item) => {
          item.hidden = filter !== 'all' && item.dataset.category !== filter;
        });

        updateGalleryCount();
      });
    });

    function showPhoto(index) {
      activeIndex = (index + activeItems.length) % activeItems.length;
      const item = activeItems[activeIndex];
      const image = item.querySelector('img');
      const caption = item.querySelector('figcaption span');

      lightboxImage.src = image.src;
      lightboxImage.alt = image.alt;
      lightboxCaption.textContent = `${caption.textContent} (${activeIndex + 1} of ${activeItems.length})`;
      previousButton.hidden = activeItems.length < 2;
      nextButton.hidden = activeItems.length < 2;
    }

    gallery.addEventListener('click', (event) => {
      const trigger = event.target.closest('.gallery-open');
      if (!trigger) return;

      activeItems = galleryItems.filter((item) => !item.hidden);
      activeIndex = activeItems.indexOf(trigger.closest('.gallery-item'));
      showPhoto(activeIndex);
      lightbox.showModal();
      closeButton.focus();
    });

    previousButton.addEventListener('click', () => showPhoto(activeIndex - 1));
    nextButton.addEventListener('click', () => showPhoto(activeIndex + 1));
    closeButton.addEventListener('click', () => lightbox.close());

    lightbox.addEventListener('click', (event) => {
      if (event.target === lightbox) lightbox.close();
    });

    lightbox.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft' && activeItems.length > 1) {
        showPhoto(activeIndex - 1);
      } else if (event.key === 'ArrowRight' && activeItems.length > 1) {
        showPhoto(activeIndex + 1);
      }
    });

    updateGalleryCount();
  </script>
</body>
</html>
